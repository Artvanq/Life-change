<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Контроль задач</title>
<meta name="description" content="Особистий застосунок для задач: календар, терміни, пріоритети, підзадачі, файли.">
<meta name="theme-color" content="#ECF0EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Контроль">
<script>try{var t=localStorage.getItem('kz.theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/styles.css?v=3">
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main" id="main"><div class="loading">Завантажую ваші задачі…</div></main>
</div>
<nav class="tabs" id="tabs" aria-label="Розділи"></nav>
<div id="bulk-root"></div>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="/importer.js?v=3"></script>
<script src="/app.js?v=3"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
</script>
</body>
</html>
